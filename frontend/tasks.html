<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Tasks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> // new content </script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #222; }
  h1 { font-size: 1.3rem; }
  #doc-info { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
  .task-option {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid #eee;
  }
  .task-option label { font-size: 0.95rem; cursor: pointer; }
  button {
    margin-top: 20px; padding: 10px 18px; border: none; border-radius: 4px;
    background: #222; color: white; font: inherit; cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 0.9rem; }
 
  #results-section {
    margin-top: 36px; padding-top: 20px; border-top: 1px solid #ddd;
  }
  #results-section h2 { font-size: 1.05rem; margin-bottom: 8px; }
  #results-display {
    min-height: 80px; padding: 12px; border: 1px dashed #ccc; border-radius: 4px;
    font-size: 0.9rem; color: #888;
  }
</style>
</head>
<body>

<button type="button" id="back-btn">Back to upload</button>
 
<h1>Select tasks to run</h1>
<div id="doc-info">Loading document info...</div>
 
<form id="tasks-form">
  <div class="task-option">
    <input type="checkbox" id="task-extract" name="tasks" value="scope2_from_utility_bills">
    <label for="task-extract">Scope 2 From Utility Bills</label>
  </div>
  <div class="task-option">
    <input type="checkbox" id="task-summarize" name="tasks" value="B">
    <label for="task-summarize">Task B</label>
  </div>
  <div class="task-option">
    <input type="checkbox" id="task-translate" name="tasks" value="C">
    <label for="task-translate">Task C</label>
  </div>
  <div class="task-option">
    <input type="checkbox" id="task-classify" name="tasks" value="D">
    <label for="task-classify">Task D</label>
  </div>
 
  <button type="submit" id="submit-btn">Run selected tasks</button>
  <button type="button" id="refresh-btn">Refresh Results</button>
  <button type="button" id="csv-btn">Download CSV</button>
  <button type="button" id="sql-btn">Download SQL</button>
  <div id="status"></div>
</form>
 
<div id="results-section">
  <h2>Results</h2>
  <!-- Empty for now -- this is where task output will eventually be rendered -->
  <div id="results-display">No results yet.</div>
</div>
 
<script>

  // check for sign in and redirect if not

  const SUPABASE_URL = "https://xymlbshoaxpteqopnyqq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1veoUrBqOnvgMyxTlOYyPg_VIdEPzrX";

  const { createClient } = supabase; // supabase-js exposes a global "supabase" object
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let cachedResults = null;

  // If already signed in (e.g. returning visitor with a valid stored
  // session), skip straight to the app instead of showing this form.
  async function getAccessToken() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      // No valid session -- send the user to sign in, since every
      // request from this page needs a token attached.
      window.location.href = "sign-in.html";
      return null;
    }
    return data.session.access_token;
  }

  // when this page was redirected to from the upload page.
  const params = new URLSearchParams(window.location.search);
  const documentListEl = document.getElementById("doc-info"); // no style element matching this
  const form = document.getElementById("tasks-form");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const refreshBtn = document.getElementById("refresh-btn");
  const csvBtn = document.getElementById("csv-btn");
  const sqlBtn = document.getElementById("sql-btn");
  const resultsDisplay = document.getElementById("results-display");

  async function loadDocuments() {
    const accessToken = await getAccessToken();
    if (!accessToken) return; // already redirecting to auth.html
 
    try {
      const response = await fetch("/tasks", {
        method: "GET",
        headers: { "Authorization": `Bearer ${accessToken}` }
      });
 
      if (!response.ok) {
        throw new Error(`Server responded with ${response.status}`);
      }
 
      const data = await response.json();

      documentListEl.textContent = data.documents.length > 0
        ? `Document: ${data.documents.map(doc => doc.document_name).join(", ")}`
        : "No document reference found — go back and upload a document first.";

    } catch (err) {
      documentListEl.textContent = `Failed to load documents: ${err.message}`;
    }
  }
  
  async function loadAndRender(FetchObj) {
    event.preventDefault();

    const accessToken = await getAccessToken();
    if (!accessToken) return;
 
    // Collect all checked task checkboxes into an array of their values.
    const selectedTasks = Array.from(
      document.querySelectorAll('input[name="tasks"]:checked')
    ).map((el) => el.value);
 
    if (selectedTasks.length === 0) {
      statusEl.textContent = "Select at least one task.";
      return;
    }
 
    submitBtn.disabled = true;
    refreshBtn.disabled = true;
    statusEl.textContent = "Running tasks...";
 
    try {
      const response = await FetchObj;
 
      if (!response.ok) {
        throw new Error(`Server responded with ${response.status}`);
      }
 
      const data = await response.json();
      statusEl.textContent = "Tasks completed.";
      cachedResults = data.results
 
    // Actual Returned Data from Backend in Table Form

    renderResults(data.results);
    } catch (err) {
      statusEl.textContent = `Task run failed: ${err.message}`;
    } finally {
      submitBtn.disabled = false;
      refreshBtn.disabled = false;
    } 
  }

  form.addEventListener("submit", async (event) => {
    // const FetchOb = fetch("/tasks", {
    //    method: "POST",
    //    headers: {
    //      "Content-Type": "application/json",
    //      "Authorization": `Bearer ${accessToken}`
    //    },
    //    body: JSON.stringify({
    //      tasks: selectedTasks
    //    })
    //  })
    //
    // loadAndRender(FetchObj)

    event.preventDefault();

    const accessToken = await getAccessToken();
    if (!accessToken) return;
 
    // Collect all checked task checkboxes into an array of their values.
    const selectedTasks = Array.from(
      document.querySelectorAll('input[name="tasks"]:checked')
    ).map((el) => el.value);
 
    if (selectedTasks.length === 0) {
      statusEl.textContent = "Select at least one task.";
      return;
    }
 
    submitBtn.disabled = true;
    refreshBtn.disabled = true;
    statusEl.textContent = "Running tasks...";
 
    try {
      const response = await fetch("/tasks", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${accessToken}`
        },
        body: JSON.stringify({
          tasks: selectedTasks
        })
      });
 
      if (!response.ok) {
        throw new Error(`Server responded with ${response.status}`);
      }
 
      const data = await response.json();
      statusEl.textContent = "Tasks completed.";
      cachedResults = data.results
 
    // Actual Returned Data from Backend in Table Form

    renderResults(data.results);
    } catch (err) {
      statusEl.textContent = `Task run failed: ${err.message}`;
    } finally {
      submitBtn.disabled = false;
      refreshBtn.disabled = false;
    }
  });

  loadDocuments()
 
  // Human-readable labels for task keys -- extend this as you add tasks.
  const TASK_LABELS = {
    scope2_from_utility_bills: "scope2_from_utility_bills",
    task_B: "B",
    task_C: "C",
    task_D: "D"
  };
 
  // results is the `results` object from the backend response:
  // { task_name: { success: bool, rows: [...] } | { success: false, error: "..." } }
  function renderResults(results) {
    resultsDisplay.innerHTML = ""; // clear "No results yet." placeholder
 
    const taskNames = Object.keys(results);
    if (taskNames.length === 0) {
      resultsDisplay.textContent = "No tasks returned results.";
      return;
    }
 
    taskNames.forEach((taskName) => {
      const taskResult = results[taskName];
 
      const section = document.createElement("div");
      section.style.marginBottom = "24px";
 
      const heading = document.createElement("h3");
      heading.style.fontSize = "0.95rem";
      heading.textContent = TASK_LABELS[taskName] || taskName;
      section.appendChild(heading);
 
      if (!taskResult.success) {
        const errorEl = document.createElement("p");
        errorEl.style.color = "#b00";
        errorEl.style.fontSize = "0.85rem";
        errorEl.textContent = `Failed: ${taskResult.error}`;
        section.appendChild(errorEl);
      } else if (!taskResult.rows || taskResult.rows.length === 0) {
        const emptyEl = document.createElement("p");
        emptyEl.style.color = "#888";
        emptyEl.style.fontSize = "0.85rem";
        emptyEl.textContent = "Succeeded, but returned no rows.";
        section.appendChild(emptyEl);
      } else {
        section.appendChild(buildTable(taskResult.rows));
      }
 
      resultsDisplay.appendChild(section);
    });
  }
 
  // Builds an HTML table from an array of row-objects, inferring columns
  // from the keys of the first row. Assumes all rows in a given task's
  // output share the same shape -- if a later row is missing a key, that
  // cell will just render empty, which is usually the desired fallback.
  function buildTable(rows) {
    const columns = Object.keys(rows[0]);
 
    const table = document.createElement("table");
    table.style.width = "100%";
    table.style.borderCollapse = "collapse";
    table.style.fontSize = "0.85rem";
 
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    columns.forEach((col) => {
      const th = document.createElement("th");
      th.textContent = col;
      th.style.textAlign = "left";
      th.style.borderBottom = "2px solid #ccc";
      th.style.padding = "6px 8px";
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
 
    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      columns.forEach((col) => {
        const td = document.createElement("td");
        // Handles missing keys and nested objects/arrays gracefully.
        const value = row[col];
        if (value === undefined) {
            td.textContent = "";               // key missing entirely from this row
        } 
        else if (value === null) {
            td.textContent = "—";              // key present, value explicitly null
        }
        else if (typeof value === "object") {
            td.textContent = JSON.stringify(value);
        } 
        else {
            td.textContent = value;
        }
        td.style.borderBottom = "1px solid #eee";
        td.style.padding = "6px 8px";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
 
    return table;
  }

  function toCSV(results) {

    const allRows = [];
    const columnSet = new Set(["task"]);

    Object.entries(results).forEach(([taskName, taskResult]) => {
      if (!taskResult.success || !taskResult.rows) return;
      taskResult.rows.forEach((row) => {
        Object.keys(row).forEach((k) => columnSet.add(k));
        allRows.push({ task: taskName, ...row });
      });
    });

    const columns = Array.from(columnSet);
    const escape = (val) => {
      if (val === null || val === undefined) return "";
      const s = String(val);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    const lines = [columns.join(",")];
    allRows.forEach((row) => {
      lines.push(columns.map((c) => escape(row[c])).join(","));
    });
    return lines.join("\n");
  }

  function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url); // release memory once the browser's grabbed it
  }

  async function downloadSQL() {
    const accessToken = await getAccessToken();
    const response = await fetch("/results/sql", {
      headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const text = await response.text();
    downloadFile(text, "results.sql", "application/sql");
  }

  document.getElementById("csv-btn").addEventListener("click", () => {
    downloadFile(toCSV(cachedResults), "results.csv", "text/csv");
  });

  document.getElementById("sql-btn").addEventListener("click", () => {
    downloadSQL();
  });

  document.getElementById("refresh-btn").addEventListener("click", async () => {
    const accessToken = await getAccessToken();
    if (!accessToken) return; // already redirecting to auth.html
    const FetchObj = fetch("/results/recent", { headers: { "Authorization": `Bearer ${accessToken}` } });
    loadAndRender(FetchObj);
  });

  document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "upload_form.html";
  });

</script>
 
</body>
</html>
