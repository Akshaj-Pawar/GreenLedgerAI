<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Document</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"], textarea {
    width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
    border: 1px solid #ccc; border-radius: 4px; font: inherit;
  }
  input[type="file"] { margin-top: 6px; }
  .type-option {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 0.9rem;
  }
  .type-option label { margin-top: 0; font-weight: normal; }
  button {
    margin-top: 20px; padding: 10px 18px; border: none; border-radius: 4px;
    background: #222; color: white; font: inherit; cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 0.9rem; }
</style>
</head>
<body>
 
<h1>Upload a document</h1>
 
<form id="upload-form">
  <label for="document_name">Document name</label>
  <input type="text" id="document_name" name="document_name" required>
 
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="3" required></textarea>
 
  <label for="file">PDF file</label>
  <input type="file" id="file" name="file" accept="application/pdf" required>

  <label>Special types (optional, select any)</label>
  <div class="type-option">
    <input type="checkbox" id="type-utility-bill" name="special_types" value="utility_bill">
    <label for="type-utility-bill">Utility_Bill</label>
  </div>
  <div class="type-option">
    <input type="checkbox" id="type-energy-payment" name="special_types" value="energy_payment">
    <label for="type-energy-payment">Energy Payment (eg vehicles)</label>
  </div>

  <button type="submit" id="submit-btn">Upload</button>
  <button type="button" id="tasks-btn">
    Continue to Task Selection
  </button>
  <div id="status"></div>

</form>
 
<script>
  const SUPABASE_URL = "https://xymlbshoaxpteqopnyqq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1veoUrBqOnvgMyxTlOYyPg_VIdEPzrX";

  const { createClient } = supabase; // supabase-js exposes a global "supabase" object
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already signed in (e.g. returning visitor with a valid stored
  // session), skip straight to the app instead of showing this form.
  async function getAccessToken() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      // No valid session -- send the user to sign in, since every
      // request from this page needs a token attached.
      window.location.href = "sign-in.html";
      return null;
    }
    return data.session.access_token;
  }

  async function checkSession() {
    const accessToken = await getAccessToken();
    if (!accessToken) return;
  }
  checkSession()

  // Grab the form element and listen for its "submit" event.
  const form = document.getElementById("upload-form");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const tasksBtn = document.getElementById("tasks-btn");

  let uploadedDocumentName = null;
  let uploadedFilePath = null;
  
  // Only redirect when the user explicitly clicks the corresponding button.
  tasksBtn.addEventListener("click", () => {
    window.location.href = "tasks.html"
  });

  form.addEventListener("submit", async (event) => {
    // Stop the browser from doing its default full-page-reload form submission.
    // We want to send this ourselves with fetch() instead.
    event.preventDefault();

    const accessToken = await getAccessToken();
    if (!accessToken) return;
 
    submitBtn.disabled = true;
    //tasksBtn.disabled = true;
    statusEl.textContent = "Uploading...";
 
    // FormData automatically matches how FastAPI's Form(...) and File(...)
    // expect multipart data. Field names here must match the backend's
    // parameter names exactly: document_name, description, file.
    const formData = new FormData();
    formData.append("document_name", document.getElementById("document_name").value);
    formData.append("description", document.getElementById("description").value);
    formData.append("file", document.getElementById("file").files[0]);
 
    // Append one entry per checked box, all under the same field name.
    // FormData supports repeated keys -- this is how a list gets sent
    // over multipart/form-data (as opposed to JSON, where you'd just
    // use a single array).
    const selectedTypes = Array.from(
      document.querySelectorAll('input[name="special_types"]:checked')
    ).map((el) => el.value);
    selectedTypes.forEach((type) => formData.append("special_types", type));

    try {
      // "await" pauses this function until the network request finishes,
      // without freezing the rest of the page. That's the whole point of
      // async functions in JS: other things can keep running while we wait.
      const response = await fetch("/documents", {
        method: "POST",
        headers: {
          //"Content-Type": "application/json",
          "Authorization": `Bearer ${accessToken}`
        },
        body: formData
        // No Content-Type header set on purpose — the browser sets the 
        // correct multipart boundary automatically when body is FormData.
      });
 
      if (!response.ok) {
        throw new Error(`Server responded with ${response.status}`);
      }
 
      const data = await response.json();

      uploadedDocumentName = data.document_name;
      uploadedFilePath = data.file_path;

      statusEl.textContent = `Success: ${data.document_name} uploaded.`;

      form.reset();

    } catch (err) {
      statusEl.textContent = `Upload failed: ${err.message}`;
    } finally {
      submitBtn.disabled = false;
      //tasksBtn.disabled = false;
    }

  });
</script>
 
</body>
</html>
